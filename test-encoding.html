<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编码测试页面</title>
</head>
<body>
    <h1>编码测试页面</h1>
    <p>这是一个包含中文字符的测试页面。</p>
    
    <h2>链接测试</h2>
    <p>这是一个<a href="https://www.example.com/中文路径">包含中文的链接</a>。</p>
    
    <h2>表格测试</h2>
    <table border="1">
        <thead>
            <tr>
                <th>中文标题</th>
                <th>English Title</th>
                <th>数字</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>中文内容</td>
                <td>English Content</td>
                <td>123</td>
            </tr>
            <tr>
                <td>另一个中文内容</td>
                <td>Another English Content</td>
                <td>456</td>
            </tr>
        </tbody>
    </table>
    
    <h2>代码测试</h2>
    <pre><code>console.log("中文测试");</code></pre>
    
    <h2>格式化文本</h2>
    <p><strong>粗体中文</strong> 和 <em>斜体中文</em> 测试。</p>
    
    <h2>列表测试</h2>
    <ul>
        <li>第一个中文项目</li>
        <li>第二个中文项目</li>
        <li>第三个中文项目</li>
    </ul>
    
    <h2>引用测试</h2>
    <blockquote>
        <p>这是一个中文引用内容。</p>
    </blockquote>
</body>
</html>
