<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>百川归档 - 增强版文档转换器</title>
  <link rel="stylesheet" href="../../libs/css/codemirror.css">
  <link rel="stylesheet" href="../../assets/styles/enhanced_styles.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 450px;
      padding: 0;
      margin: 0;
      background: #f8f9fa;
    }
    
    .header {
      position: relative;
      text-align: center;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px 8px 0 0;
    }
    
    .header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.2s;
    }
    
    .close-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .container {
      padding: 20px;
    }
    
    .control-section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #495057;
      margin-bottom: 10px;
    }
    
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      color: #495057;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn:hover {
      background: #f8f9fa;
      border-color: #007bff;
    }
    
    .btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
    
    .btn.btn-primary {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
    
    .btn.btn-success {
      background: #28a745;
      color: white;
      border-color: #28a745;
    }
    
    .btn.btn-secondary {
      background: #6c757d;
      color: white;
      border-color: #6c757d;
    }
    
    .btn:disabled {
      background: #f8f9fa;
      color: #6c757d;
      border-color: #dee2e6;
      cursor: not-allowed;
    }
    
    /* Select元素特殊样式 */
    select.btn {
      padding-right: 24px;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    
    select.btn:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }
    
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 20px;
      background: #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.3s;
      margin-left: auto;
      flex-shrink: 0;
    }
    
    .toggle-switch.active {
      background: #28a745;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    
    .toggle-switch.active::after {
      transform: translateX(20px);
    }
    
    .config-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f3f4;
    }
    
    .config-item:last-child {
      border-bottom: none;
    }
    
    .config-label {
      font-size: 13px;
      color: #6c757d;
    }
    

    
    .status-section {
      background: white;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      margin-bottom: 15px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .status-item:last-child {
      margin-bottom: 0;
    }
    
    .status-label {
      font-size: 13px;
      color: #6c757d;
    }
    
    .status-value {
      font-size: 13px;
      font-weight: 600;
      color: #007bff;
    }
    
    .progress-container {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      display: none;
    }
    
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .progress-status {
      font-size: 13px;
      color: #495057;
      font-weight: 500;
    }
    
    .progress-count {
      font-size: 13px;
      color: #6c757d;
    }
    
    .progress-bar-container {
      height: 6px;
      background: #f1f3f4;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #007bff, #0056b3);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .current-url {
      font-size: 12px;
      color: #6c757d;
      word-break: break-all;
    }
    
    .batch-section {
      background: white;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      margin-bottom: 15px;
      display: none;
    }
    
    .batch-input {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      font-size: 13px;
      resize: vertical;
      font-family: monospace;
      margin-bottom: 10px;
    }
    
    .tab-container {
      display: flex;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid #dee2e6;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: #f8f9fa;
      color: #6c757d;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-size: 13px;
    }
    
    .tab.active {
      background: #007bff;
      color: white;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #28a745;
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 1000;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    
    .notification.show {
      transform: translateX(0);
    }
    
    /* 选择状态样式 */
    .selection-status {
      background: #e8f4fd;
      border: 1px solid #007bff;
      border-radius: 6px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .status-title {
      font-weight: 600;
      color: #007bff;
      font-size: 14px;
    }
    
    .btn-close-selection {
      width: 20px;
      height: 20px;
      border: none;
      background: rgba(0,123,255,0.1);
      color: #007bff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-close-selection:hover {
      background: rgba(0,123,255,0.2);
    }
    
    .selection-modes {
      margin-bottom: 12px;
    }
    
    .mode-label {
      font-size: 12px;
      color: #495057;
      margin-bottom: 6px;
    }
    
    .mode-buttons {
      display: flex;
      gap: 4px;
    }
    
    .mode-btn {
      padding: 4px 8px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      background: white;
      color: #495057;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    
    .mode-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }
    
    .mode-btn:hover:not(.active) {
      background: #f8f9fa;
      border-color: #007bff;
    }
    
    .selection-info {
      background: white;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 12px;
    }
    
    .info-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .info-label {
      font-size: 12px;
      color: #6c757d;
    }
    
    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #007bff;
    }
    
    .info-unit {
      font-size: 12px;
      color: #6c757d;
    }
    
    .selection-actions {
      display: flex;
      gap: 6px;
    }
    
    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: #2d2d2d;
        color: #ffffff;
      }
      
      .header {
        background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      }
      
      .container {
        background: #2d2d2d;
      }
      
      .btn, .status-section, .progress-container, .batch-section, .tab-container {
        background: #404040;
        border-color: #555555;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>百川归档 - 文档转换器</h3>
    <button class="close-btn" id="close-popup-btn" title="关闭">×</button>
  </div>

  <div class="container">
    <!-- 标签页导航 -->
    <div class="tab-container">
      <button class="tab active" data-tab="main">主要功能</button>
      <button class="tab" data-tab="batch">批量处理</button>
      <button class="tab" data-tab="config">设置</button>
    </div>

    <!-- 主要功能标签页 -->
    <div id="main-tab" class="tab-content active">
      <div class="control-section">
        <div class="section-title">操作选项</div>
        <div class="button-group">
          <button class="btn btn-primary" id="toggle-selection-btn">开始选择</button>
          <button class="btn btn-success" id="process-btn" disabled>处理并下载</button>
        </div>
        
        <!-- 选择模式状态显示 -->
        <div class="selection-status" id="selection-status" style="display: none;">
          <div class="status-header">
            <span class="status-title">选择模式已激活</span>
            <button class="btn-close-selection" id="close-selection-btn">×</button>
          </div>
          
          <div class="selection-modes">
            <div class="mode-label">选择模式:</div>
            <div class="mode-buttons">
              <button class="mode-btn active" data-mode="links">链接</button>
              <button class="mode-btn" data-mode="elements">元素</button>
              <button class="mode-btn" data-mode="area">区域</button>
            </div>
          </div>
          
          <div class="selection-info">
            <div class="info-item">
              <span class="info-label">已选择:</span>
              <span class="info-value" id="selection-count">0</span>
              <span class="info-unit">项</span>
            </div>
          </div>
          
          <div class="selection-actions">
            <button class="btn btn-sm btn-success" id="process-selection-btn">处理选中内容</button>
            <button class="btn btn-sm btn-secondary" id="clear-selection-btn">清空选择</button>
          </div>
        </div>
        
        <div class="config-item">
          <span class="config-label">下载图片</span>
          <div class="toggle-switch" id="download-images-toggle"></div>
        </div>
        
        <div class="config-item">
          <span class="config-label">包含模板</span>
          <div class="toggle-switch" id="include-template-toggle"></div>
        </div>
        
        
      </div>



      <div class="status-section">
        <div class="section-title">状态信息</div>
        <div class="status-item">
          <span class="status-label">已选择链接</span>
          <span class="status-value" id="link-count">0</span>
        </div>
        <div class="status-item">
          <span class="status-label">处理状态</span>
          <span class="status-value" id="status-message">就绪</span>
        </div>
      </div>
    </div>

    <!-- 批量处理标签页 -->
    <div id="batch-tab" class="tab-content">
      <div class="batch-section" style="display: block;">
        <div class="section-title">批量处理</div>
        <textarea class="batch-input" id="batch-urls" placeholder="输入要转换的URL（每行一个）&#10;例如：&#10;https://example.com/page1&#10;https://example.com/page2"></textarea>
        
        <div class="button-group">
          <button class="btn btn-primary" id="convert-urls-btn">转换所有</button>
          <button class="btn btn-secondary" id="clear-urls-btn">清空</button>
        </div>
      </div>

      <div class="progress-container" id="progress-container">
        <div class="progress-header">
          <span class="progress-status" id="progress-status">处理中...</span>
          <span class="progress-count" id="progress-count">0/0</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="current-url" id="current-url"></div>
      </div>
    </div>

    <!-- 配置标签页 -->
    <div id="config-tab" class="tab-content">
      <div class="control-section">
        <div class="section-title">内容处理</div>
        
        <div class="config-item">
          <span class="config-label">智能内容提取</span>
          <div class="toggle-switch active" id="smart-extraction-toggle"></div>
        </div>
        
        <div class="config-item">
          <span class="config-label">代码语言检测</span>
          <div class="toggle-switch active" id="code-detection-toggle"></div>
        </div>
        
        <div class="config-item">
          <span class="config-label">表格格式化</span>
          <div class="toggle-switch active" id="table-formatting-toggle"></div>
        </div>
        
        <div class="config-item">
          <span class="config-label">中文优化</span>
          <div class="toggle-switch active" id="chinese-optimization-toggle"></div>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">导出选项</div>
        
        <div class="button-group">
          <button class="btn btn-secondary" id="import-config-btn">导入配置</button>
          <button class="btn btn-secondary" id="export-config-btn">导出配置</button>
          <button class="btn btn-secondary" id="reset-config-btn">重置配置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 脚本引入 -->
  <script src="../shared/default-options.js"></script>
  <script src="popup_marksnip_enhanced.js"></script>
</body>
</html>
