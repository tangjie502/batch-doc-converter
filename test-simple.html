<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简单测试页面</title>
</head>
<body>
    <h1>简单测试页面</h1>
    
    <h2>表格测试</h2>
    <table>
        <tr>
            <th>列1</th>
            <th>列2</th>
        </tr>
        <tr>
            <td>数据1</td>
            <td><a href="https://example.com">链接</a></td>
        </tr>
    </table>
    
    <h2>代码测试</h2>
    <pre><code class="language-javascript">console.log("Hello World");</code></pre>
    
    <h2>链接测试</h2>
    <p>这是一个<a href="https://github.com">GitHub</a>链接。</p>
    
    <h2>格式化测试</h2>
    <p>这是<strong>粗体</strong>和<em>斜体</em>文本。</p>
</body>
</html>
